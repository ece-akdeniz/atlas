services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORTAL_ENV: production
      PORTAL_DB: /data/portal.sqlite3
    volumes:
      - atlas-data:/data
    networks: [atlas]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health',headers={'Host':__import__('urllib.parse',fromlist=['urlsplit']).urlsplit(__import__('os').environ['PORTAL_ORIGIN']).netloc}))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  worker:
    build: .
    command: [python, -m, portal.worker]
    env_file: .env
    restart: unless-stopped
    environment:
      PORTAL_DB: /data/portal.sqlite3
    volumes:
      - atlas-data:/data
    networks: [atlas]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file: .env
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [atlas]
    depends_on: [web]
volumes:
  atlas-data:
  caddy-data:
  caddy-config:
networks:
  atlas:
