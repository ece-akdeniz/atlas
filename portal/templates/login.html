<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Atlas</title><link rel="icon" href="/static/favicon.svg"><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/style.css"></head><body class="login"><main class="login-card"><div class="brand"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 2v20M2 12h20M5 5l14 14M5 19L19 5"/></svg>Atlas</div><h1>Welcome back</h1><p>Sign in to your opportunity workspace.</p><form method="post"><input type="hidden" name="nonce" value="{{nonce}}"><label class="field">Email<input type="email" name="email" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false"></label><label class="field">Password<input type="password" name="password" required autocomplete="current-password"></label>{% if error %}<p class="danger" role="alert">{{error}}</p>{% endif %}<button class="primary">Sign in</button></form></main></body></html>
